name: Clean Medical Drive Folder

on:
  workflow_dispatch:
    inputs:
      apply:
        description: 'Actually rename files and move duplicates/unresolved files to _REVISAR on Drive (unchecked = dry run only). The nightly schedule always applies regardless of this.'
        type: boolean
        default: false
  schedule:
    # Runs fully unattended with --apply every night, ahead of the labs
    # ingest — no one has to click anything for normal operation. A manual
    # workflow_dispatch run still defaults to a dry run unless "apply" is
    # checked, which is useful for previewing a change to this script
    # itself before trusting it to run unattended again.
    - cron: '0 7 * * *'

permissions:
  contents: write

jobs:
  clean:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install poppler (for scanned PDF -> image rendering)
        run: sudo apt-get update && sudo apt-get install -y poppler-utils

      - name: Install dependencies
        run: |
          pip install \
            anthropic \
            pdfplumber \
            pdf2image \
            Pillow \
            openpyxl \
            google-auth \
            google-api-python-client \
            google-auth-httplib2

      - name: Run cleaner (nightly schedule always applies; manual runs are dry-run unless "apply" is checked)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GDRIVE_CREDENTIALS: ${{ secrets.GDRIVE_CREDENTIALS }}
        run: |
          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ inputs.apply }}" = "true" ]; then
            python clean_medical_drive.py --apply
          else
            python clean_medical_drive.py
          fi

      # Both of these run with if: always() — the cleaner now writes the log
      # and tracker for whatever it finished before failing (e.g. a Drive
      # permissions error partway through), and a skipped upload/commit would
      # throw that completed work away even though it's sitting right there
      # on disk.
      - name: Upload rename log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rename_log
          path: rename_log.csv
          if-no-files-found: warn

      - name: Commit updated master tracker
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add tracker/master_tracker.xlsx
          git diff --cached --quiet || git commit -m "chore: update master tracker $(date -u '+%Y-%m-%d %H:%M') UTC"
          git push
